# Baut nymo-setup.exe aus dem nymo-windows.zip eines Releases -- auf einem Windows-Runner, mit Inno Setup 6
# (vorinstalliert). Laeuft von selbst, sobald ein Release veroeffentlicht wird (gh release create ...), oder von
# Hand: gh workflow run installer.yml -f tag=v1.1. Vorher prueft installer/pruefe.py das Paket mit dem
# mitgelieferten Python (Pakete, Poppler, KI-Erkennung, Server). Haengt Installer und SHA256SUMS.txt ans Release.
#
# Quelle dieser Datei: KI-Kanzlei/nymo/app-win/installer/installer.yml (app-win/veroeffentlichen.sh gleicht ab).
name: Installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release-Tag, z. B. v1.1"
        required: true

permissions:
  contents: write

jobs:
  installer:
    # Code-Releases (seit 1.12, nur nymo-update.zip/.json) haben kein Windows-Paket: dann nicht starten -- sonst schlug der
    # Lauf nach 16 s fehl und GitHub schickte je Release eine Mail (BJ, 11.11.2026)
    if: github.event_name != 'release' || contains(join(github.event.release.assets.*.name, ','), 'nymo-windows.zip')
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Tag und Version
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'release') { '${{ github.event.release.tag_name }}' } else { '${{ inputs.tag }}' }
          if (-not $tag) { throw "Kein Tag" }
          "TAG=$tag" >> $env:GITHUB_ENV
          "VERSION=$($tag.TrimStart('v'))" >> $env:GITHUB_ENV
          "Release $tag"

      - name: Zip aus dem Release laden
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download $env:TAG --pattern nymo-windows.zip --dir paket --repo ${{ github.repository }}

      - name: Entpacken
        run: |
          7z x -y -opaket paket\nymo-windows.zip | Select-String -Pattern "Everything is Ok|Error|Files:"
          Remove-Item paket\nymo-windows.zip
          Get-ChildItem paket

      # Was das Vorkompilieren im Installer (nymo.iss, [Run]) bringt: dieselben Importe wie der KI-Dienst und die OCR,
      # einmal ohne .pyc (wie bisher beim ersten Start) und einmal danach. Nur Messung, scheitert nie.
      - name: Startzeit messen (ohne und mit Bytecode)
        continue-on-error: true
        run: |
          $py = "paket\nymo\python\python.exe"
          $code = "import sys; sys.path.insert(0, r'paket\nymo\ki\Lib\site-packages'); import torch, gliner, rapidocr, onnxruntime, pypdfium2"
          $kalt = Measure-Command { & $py -I -c $code }
          $warm = Measure-Command { & $py -I -c $code }
          "Importe ohne .pyc: $([int]$kalt.TotalSeconds) s, mit .pyc: $([int]$warm.TotalSeconds) s"
          Get-ChildItem paket\nymo -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force

      - name: Paket pruefen (mitgeliefertes Python)
        run: paket\nymo\python\python.exe -I installer\pruefe.py paket\nymo

      - name: Installer bauen (Inno Setup)
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          # Pfade absolut: Inno Setup loest relative Pfade vom Skript (installer\) aus auf, nicht vom Arbeitsordner
          & $iscc "/DVersion=$env:VERSION" "/DQuelle=$PWD\paket" "/DZiel=$PWD\ausgabe" installer\nymo.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC: $LASTEXITCODE" }
          Get-Item ausgabe\nymo-setup.exe | Select-Object Name, Length

      # Signieren (Windows, noch offen: Azure oder Certum) gehoert VOR diesen Schritt -- in den Installer-Bau oben
      # (SignTool in nymo.iss) bzw. in app-win/paket.sh fuer das Zip: die Pruefsummen muessen ueber die signierten Dateien laufen.
      - name: Pruefsummen (SHA-256)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:TAG --pattern nymo-windows.zip --dir ausgabe --repo ${{ github.repository }}
          # Mac-Paket (seit v1.3) und kleines Update (seit v1.10, nymo-update.zip): nur, wenn sie am Release haengen
          $namen = gh release view $env:TAG --json assets --jq '.assets[].name' --repo ${{ github.repository }}
          $dateien = @("ausgabe\nymo-setup.exe", "ausgabe\nymo-windows.zip")
          $dazu = @()
          foreach ($n in @("nymo-mac.zip", "nymo-update.zip")) {
            if ($namen -contains $n) {
              gh release download $env:TAG --pattern $n --dir ausgabe --repo ${{ github.repository }}
              $dateien += "ausgabe\$n"
              $dazu += "ausgabe\$n"
            }
          }
          $zeilen = foreach ($f in $dateien) {
            "$((Get-FileHash $f -Algorithm SHA256).Hash.ToLower())  $(Split-Path $f -Leaf)"
          }
          ($zeilen -join "`n") + "`n" | Set-Content -NoNewline -Encoding ascii ausgabe\SHA256SUMS.txt
          Get-Content ausgabe\SHA256SUMS.txt
          Remove-Item ausgabe\nymo-windows.zip
          foreach ($f in $dazu) { Remove-Item $f }

      - name: Ans Release haengen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:TAG ausgabe\nymo-setup.exe ausgabe\SHA256SUMS.txt --clobber --repo ${{ github.repository }}
